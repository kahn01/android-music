name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Prepare release signing key
        env:
          DURKA_KEYSTORE_BASE64: ${{ secrets.DURKA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DURKA_KEYSTORE_BASE64" ]; then
            echo "$DURKA_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/durka-release.jks"
          fi
      - name: Build release AAB
        run: gradle :app:bundleRelease
        env:
          DURKA_STORE_FILE: ${{ runner.temp }}/durka-release.jks
          DURKA_STORE_PASSWORD: ${{ secrets.DURKA_STORE_PASSWORD }}
          DURKA_KEY_ALIAS: ${{ secrets.DURKA_KEY_ALIAS }}
          DURKA_KEY_PASSWORD: ${{ secrets.DURKA_KEY_PASSWORD }}
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: durka-release-aab
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: durka-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
